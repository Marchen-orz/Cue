<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Cue · 宣传片舞台</title>
<link rel="icon" href="/favicon.svg">
<!--
  Cue 宣传片 / 产品图舞台。

  画面里的 Cue 不是画出来的：#app 是真实前端（frontend/），后端由 mock.js 伪造。
  舞台是 t 的纯函数——stage.js 的 render(t) 决定这一帧桌面长什么样、Cue 处于什么状态。

    node promo/serve.mjs         然后打开 http://127.0.0.1:5199/__promo/index.html 实时预览
    python promo/render.py       逐帧导出 mp4 + README 用图
-->
<style>
  :root {
    --ui: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "Microsoft YaHei UI", monospace;
    /* 提示层的视觉语言：跟软件一致——冷白（对应浅色主题）+ 深海军蓝墨 + logo 的品牌蓝；直角、无描边、无发光。无衬线粗体做标题，DIN 风格数字，等宽做标注 */
    --sans: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --head: "Noto Sans SC", "Microsoft YaHei UI", "PingFang SC", sans-serif;
    --num: "Bahnschrift", "Segoe UI", sans-serif;
    --paper: #eef2f7; --ink: #0b1220; --ink2: #5a6678; --hot: #0a84d0; --hot2: #38bdf8;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #05080f; overflow: hidden; font-family: var(--ui); }
  #fit { position: fixed; inset: 0; display: grid; place-items: center; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; flex: none; background: var(--paper);
    transform-origin: center; }
  body.capture #fit { display: block; }
  body.capture #stage { transform: none !important; }
  body.capture #player { display: none; }

  /* ==================== 世界（随镜头变换） ==================== */
  #world, #share { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
    transform-origin: 0 0; overflow: hidden; background: var(--ink); }
  #share { visibility: hidden; }
  .desk { position: absolute; inset: 0; }

  .win { position: absolute; left: 0; top: 0; width: 1920px; height: 1032px; overflow: hidden; }

  /* ---- 浏览器外壳 ---- */
  .chrome-tabs { height: 40px; background: #dfe3ea; display: flex; align-items: flex-end; padding-left: 10px; gap: 2px; }
  .ctab { height: 32px; min-width: 232px; padding: 0 14px; display: flex; align-items: center; gap: 9px;
    font-size: 12.5px; color: #4b5563; border-radius: 9px 9px 0 0; }
  .ctab.on { background: #f7f8fa; color: #111827; }
  .ctab .fav { width: 16px; height: 16px; border-radius: 4px; background: #f97316; flex: none; }
  .ctab .fav.g { background: #94a3b8; }
  .ctab .x { margin-left: auto; color: #9ca3af; font-size: 13px; }
  .wctl { margin-left: auto; display: flex; height: 40px; align-items: stretch; }
  .wctl i { width: 46px; display: grid; place-items: center; font-style: normal; color: #374151; font-size: 12px; }
  .chrome-bar { height: 44px; background: #f7f8fa; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; gap: 14px; padding: 0 14px; }
  .chrome-bar .nav { display: flex; gap: 14px; }
  .chrome-bar .nav i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #9ca3af; opacity: .7; }
  .url { flex: 1; height: 30px; border-radius: 15px; background: #eceff3; display: flex; align-items: center; padding: 0 14px; gap: 9px;
    font-size: 13px; color: #374151; }
  .url .lock { width: 9px; height: 8px; border-radius: 2px; background: #6b7280; position: relative; }
  .url .lock::before { content: ""; position: absolute; left: 1.5px; top: -5px; width: 6px; height: 6px; border: 1.5px solid #6b7280; border-bottom: 0; border-radius: 4px 4px 0 0; box-sizing: border-box; }
  .rec { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 12px; border-radius: 14px; background: #fee2e2; color: #b91c1c; font-size: 12.5px; font-weight: 600; }
  .rec i { width: 8px; height: 8px; border-radius: 50%; background: #dc2626; }

  /* ---- 笔试页 ---- */
  .page { position: absolute; left: 0; top: 84px; right: 0; bottom: 0; background: #f3f4f6; color: #1f2937; }
  .xhead { height: 56px; background: #fff; border-bottom: 1px solid #e5e7eb; display: flex; align-items: center; padding: 0 24px; gap: 22px; }
  .xbrand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; }
  .xbrand b { width: 26px; height: 26px; border-radius: 7px; background: linear-gradient(135deg, #fb923c, #ea580c); }
  .xsteps { display: flex; gap: 8px; margin-left: 8px; }
  .xsteps span { width: 30px; height: 26px; border-radius: 6px; background: #f3f4f6; color: #6b7280; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; }
  .xsteps .done { background: #dcfce7; color: #15803d; }
  .xsteps .cur { background: #f97316; color: #fff; }
  .xright { margin-left: auto; display: flex; align-items: center; gap: 18px; font-size: 13px; color: #4b5563; }
  .mon { display: flex; align-items: center; gap: 7px; color: #b45309; }
  .mon i { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; }
  .timer b { font-family: var(--mono); font-size: 15px; color: #111827; margin-left: 4px; }
  .xright .submit { height: 32px; padding: 0 18px; border-radius: 8px; background: #f97316; color: #fff; font-weight: 600; display: grid; place-items: center; }

  .xbody { position: absolute; left: 0; top: 56px; right: 0; bottom: 0; display: flex; }
  .xprob { position: relative; flex: none; width: 720px; background: #fff; border-right: 1px solid #e5e7eb; overflow: hidden; }
  .xq { position: absolute; inset: 0; overflow: hidden; padding: 26px 30px; }
  .xq[data-q="2"] { padding: 0; }
  .xscroll { padding: 26px 30px; }
  .xthumb { position: absolute; right: 4px; width: 6px; border-radius: 3px; background: rgba(100,116,139,.42); }
  .ptag { display: inline-block; font-size: 12.5px; font-weight: 600; color: #c2410c; background: #ffedd5; padding: 4px 10px; border-radius: 6px; }
  .xprob h2 { margin: 14px 0 12px; font-size: 24px; color: #111827; letter-spacing: .2px; }
  .xprob p { margin: 0 0 14px; font-size: 15.5px; line-height: 1.75; color: #374151; }
  .xprob code { font-family: var(--mono); font-size: 14px; background: #f3f4f6; padding: 1px 6px; border-radius: 4px; color: #be123c; }
  .xprob h4 { margin: 18px 0 8px; font-size: 14.5px; color: #111827; }
  .xprob pre { margin: 0; padding: 12px 16px; border-radius: 8px; background: #f8fafc; border: 1px solid #e5e7eb;
    font-family: var(--mono); font-size: 13.5px; line-height: 1.7; color: #334155; white-space: pre-wrap; }
  .xprob ul { margin: 0; padding-left: 20px; font-size: 14.5px; line-height: 1.9; color: #374151; }
  .xprob table { width: 100%; border-collapse: collapse; font-size: 14px; color: #374151; }
  .xprob th, .xprob td { border: 1px solid #e5e7eb; padding: 7px 12px; text-align: left; }
  .xprob th { background: #f8fafc; color: #111827; font-weight: 600; }
  .opts { display: grid; gap: 12px; margin-top: 18px; }
  .opt { display: flex; align-items: center; gap: 14px; padding: 12px 16px; border: 1px solid #e5e7eb; border-radius: 10px; font-size: 15px; color: #374151; }
  .opt b { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #cbd5e1; display: grid; place-items: center; font-size: 13.5px; color: #475569; }
  .xsheet { flex: 1; min-width: 0; background: #f8fafc; padding: 44px 52px; color: #374151; }
  .xsheet h3 { margin: 0 0 12px; font-size: 20px; color: #111827; }
  .xsheet p { margin: 0; font-size: 14.5px; line-height: 1.8; color: #6b7280; }
  .sheet-grid { display: flex; gap: 14px; margin-top: 28px; }
  .sheet-grid span { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 18px; font-weight: 700; background: #fff; border: 1.5px solid #e5e7eb; color: #6b7280; }
  .sheet-grid .ok { background: #dcfce7; border-color: #86efac; color: #15803d; }
  .sheet-grid .now { border-color: #f97316; color: #ea580c; box-shadow: 0 0 0 4px rgba(249,115,22,.14); }
  .sheet-note { margin-top: 22px; font-size: 13.5px; color: #9ca3af; }

  .xedit { flex: 1; background: #1b1e2b; color: #cdd6f4; display: flex; flex-direction: column; min-width: 0; }
  .etabs { height: 44px; background: #161925; display: flex; align-items: center; padding: 0 16px; gap: 14px; font-size: 13px; color: #8b93a7; }
  .etabs .lang { padding: 5px 12px; border-radius: 6px; background: #262a3a; color: #cdd6f4; font-family: var(--mono); font-size: 12.5px; }
  .etabs .run { margin-left: auto; padding: 6px 16px; border-radius: 7px; background: #262a3a; color: #a6e3a1; font-weight: 600; }
  .code { flex: 1; padding: 14px 0; font-family: var(--mono); font-size: 14px; line-height: 26px; position: relative; }
  .ln { display: flex; height: 26px; white-space: pre; }
  .ln .n { width: 56px; text-align: right; padding-right: 16px; color: #4b5068; flex: none; }
  .ln.hl { background: rgba(255,255,255,.04); }
  .k { color: #cba6f7; } .t { color: #89dceb; } .f { color: #89b4fa; } .s { color: #a6e3a1; } .c { color: #6c7086; } .m { color: #fab387; }
  .caret { display: inline-block; width: 2px; height: 18px; background: #f5e0dc; vertical-align: -3px; margin-left: 1px; }
  .console { height: 236px; border-top: 1px solid #2a2e3f; background: #161925; padding: 12px 18px; font-size: 13px; color: #8b93a7; }
  .console .ct { display: flex; gap: 20px; margin-bottom: 12px; }
  .console .ct b { color: #cdd6f4; border-bottom: 2px solid #f97316; padding-bottom: 6px; }
  .console pre { margin: 0; font-family: var(--mono); line-height: 1.8; color: #7f849c; }

  /* ---- 视频面试窗口 ---- */
  .meet { background: #0f1319; color: #e5e7eb; }
  .mhead { height: 64px; display: flex; align-items: center; padding: 0 28px; gap: 14px; font-size: 15px; font-weight: 600; }
  .mhead .live { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
  .mhead .mtime { margin-left: auto; font-family: var(--mono); font-weight: 400; color: #9ca3af; font-size: 14px; }
  .mhead .mshare { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 14px; border-radius: 15px; background: rgba(239,68,68,.16); color: #fca5a5; font-size: 12.5px; }
  .mhead .mshare i { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
  .tile { position: absolute; border-radius: 18px; background: linear-gradient(160deg, #1b2330, #141a24); overflow: hidden; border: 2px solid transparent; }
  .tile.big { left: 40px; top: 84px; width: 1000px; height: 830px; }
  .tile.t2 { left: 1072px; top: 84px; width: 808px; height: 405px; }
  .tile.t3 { left: 1072px; top: 509px; width: 808px; height: 405px; }
  .tile .glow { position: absolute; inset: 0; background: radial-gradient(520px 420px at 50% 42%, rgba(56,189,248,.16), transparent 70%); }
  .avatar { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); border-radius: 50%; display: grid; place-items: center; overflow: hidden; }
  .tile.big .avatar { width: 300px; height: 300px; background: linear-gradient(145deg, #334155, #1e293b); }
  .tile.t2 .avatar, .tile.t3 .avatar { width: 150px; height: 150px; background: linear-gradient(145deg, #3f3f46, #27272a); }
  .avatar svg { width: 100%; height: 100%; }
  .ring { position: absolute; left: 50%; top: 44%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 3px solid #22c55e; opacity: 0; }
  .nametag { position: absolute; left: 20px; bottom: 18px; height: 34px; padding: 0 14px; border-radius: 9px; background: rgba(0,0,0,.5); display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .tile.big .nametag { left: 50%; bottom: auto; top: calc(44% + 182px); transform: translateX(-50%); height: 40px; font-size: 16px; }
  .eq { display: flex; align-items: center; gap: 3px; height: 16px; }
  .eq i { width: 3px; height: 4px; border-radius: 2px; background: #22c55e; }
  .mbar { position: absolute; left: 0; right: 0; bottom: 20px; height: 68px; display: flex; justify-content: center; gap: 16px; }
  .mbtn { width: 68px; height: 68px; border-radius: 20px; background: #1f2733; display: grid; place-items: center; }
  .mbtn i { width: 22px; height: 22px; border-radius: 6px; border: 2.5px solid #cbd5e1; }
  .mbtn.on { background: rgba(34,197,94,.2); } .mbtn.on i { border-color: #4ade80; }
  .mbtn.end { background: #dc2626; width: 96px; } .mbtn.end i { border-color: #fff; border-radius: 3px; height: 10px; }

  /* ---- 任务栏 ---- */
  .taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 48px; background: #151a26; display: flex; align-items: center; justify-content: center; gap: 12px; }
  .taskbar i { width: 28px; height: 28px; border-radius: 7px; background: #2a3142; }
  .taskbar i.a { background: linear-gradient(135deg, #38bdf8, #2563eb); }
  .taskbar i.b { background: linear-gradient(135deg, #fb923c, #ea580c); box-shadow: 0 6px 0 -3px #f97316; }
  .taskbar i.c { background: linear-gradient(135deg, #4ade80, #16a34a); }
  .taskbar .clock { position: absolute; right: 22px; color: #cbd5e1; font-size: 12.5px; text-align: right; line-height: 1.35; }

  /* ---- Cue 窗口 ---- */
  #appwrap { position: absolute; }
  #app { display: block; border: 0; background: transparent; }

  /* ---- 系统窗口：文件选择框 / 下拉列表 / 资源管理器 / 图片查看器 ---- */
  .oswin { position: absolute; display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; visibility: hidden; opacity: 0;
    background: #f3f3f3; color: #1b1b1b; font-size: 13px; border: 1px solid rgba(0,0,0,.3); box-shadow: 0 34px 90px rgba(0,0,0,.55); transform-origin: 50% 40%; }
  .tbar { flex: none; height: 36px; display: flex; align-items: center; gap: 9px; padding-left: 13px; font-size: 12.5px; }
  .tbar .ico { width: 16px; height: 16px; border-radius: 4px; background: linear-gradient(135deg, #38bdf8, #2563eb); }
  .tbar .ico.folder { background: linear-gradient(#fcd34d, #f59e0b); }
  .tbar .ico.photo { background: linear-gradient(135deg, #60a5fa, #a78bfa); }
  .tbar .ctl { margin-left: auto; display: flex; height: 100%; }
  .tbar .ctl i { width: 46px; display: grid; place-items: center; font-style: normal; font-size: 11px; color: #555; }
  .addr { flex: none; height: 42px; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
  .addr .navs { letter-spacing: 9px; color: #8a8a8a; font-size: 15px; }
  .addr .path { flex: 1; height: 30px; display: flex; align-items: center; gap: 7px; padding: 0 12px; border-radius: 5px; background: #fff; border: 1px solid #e0e0e0; }
  .addr .path b { color: #9a9a9a; font-weight: 400; }
  .addr .find { width: 150px; height: 30px; padding: 0 12px; line-height: 28px; border-radius: 5px; background: #fff; border: 1px solid #e0e0e0; color: #9a9a9a; }
  .osbody { flex: 1; min-height: 0; display: flex; background: #fff; border-top: 1px solid #e5e5e5; }
  .oside { flex: none; width: 132px; padding: 8px 6px; border-right: 1px solid #ececec; }
  .oside div { height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 10px; border-radius: 5px; }
  .oside div.on { background: #e5f1fb; }
  .oside i { width: 15px; height: 12px; border-radius: 2px; background: linear-gradient(#fcd34d, #f59e0b); }
  .flist { flex: 1; min-width: 0; padding: 4px 8px; position: relative; }
  .fhead, .frow { display: grid; grid-template-columns: 1fr 128px 104px 54px; align-items: center; height: 30px; padding: 0 8px; white-space: nowrap; }
  .fhead { color: #6b6b6b; font-size: 12px; border-bottom: 1px solid #f0f0f0; margin-bottom: 3px; }
  .frow { border-radius: 4px; border: 1px solid transparent; }
  .frow span { overflow: hidden; display: flex; align-items: center; gap: 9px; }
  .frow .dim { color: #707070; font-size: 12px; }
  .frow.sel { background: #cce8ff; border-color: #99d1ff; }
  .frow i { flex: none; width: 15px; height: 18px; border-radius: 2px; background: #fff; border: 1px solid #b9c2cf; position: relative; }
  .frow i::after { content: ""; position: absolute; left: 2px; right: 2px; bottom: 3px; height: 4px; border-radius: 1px; background: #60a5fa; }
  .frow i.pdf::after { background: #ef4444; }
  .frow i.dir, .frow i.zip { height: 13px; border: 0; background: linear-gradient(#fcd34d, #f59e0b); }
  .frow i.dir::after { display: none; }
  .frow i.zip::after { left: 6px; right: 6px; top: 0; bottom: 0; height: auto; border-radius: 0; background: repeating-linear-gradient(#78716c 0 2px, #fef3c7 2px 4px); }
  .fnote { position: absolute; left: 16px; right: 16px; bottom: 12px; font-size: 12px; line-height: 1.7; color: #8a8a8a; white-space: normal; }
  .ffoot { flex: none; display: grid; grid-template-columns: auto 1fr 190px; gap: 10px; align-items: center; padding: 12px 14px 14px; background: #f3f3f3; border-top: 1px solid #e5e5e5; }
  .ffoot .inp { height: 28px; padding: 0 10px; line-height: 26px; background: #fff; border: 1px solid #c8c8c8; border-bottom-color: #868686; border-radius: 4px; white-space: nowrap; overflow: hidden; }
  .ffoot .inp.sel { display: flex; justify-content: space-between; font-size: 12px; }
  .ffoot .inp em { font-style: normal; color: #666; }
  .ffoot .btns { grid-column: 1 / -1; display: flex; justify-content: flex-end; gap: 10px; }
  .obtn { width: 92px; height: 30px; border-radius: 5px; display: grid; place-items: center; background: #fbfbfb; border: 1px solid #d0d0d0; }
  .obtn.pri { background: #0067c0; border-color: #0067c0; color: #fff; }
  #fdlg { width: 640px; height: 404px; }

  #selpop { position: absolute; visibility: hidden; opacity: 0; padding: 1px 0; background: #2b2b2b; color: #f3f4f6; font-size: 13px;
    border: 1px solid #6b7280; box-shadow: 0 10px 28px rgba(0,0,0,.5); }
  #selpop div { height: 24px; line-height: 24px; padding: 0 10px; white-space: nowrap; }
  #selpop div.hot { background: #0a6cc4; color: #fff; }

  #explorer { left: 50px; top: 170px; width: 960px; height: 640px; }
  #explorer .flist { flex: none; width: 430px; }
  #explorer .fhead, #explorer .frow { grid-template-columns: 1fr 124px 104px 0; }
  .pview { flex: 1; min-width: 0; position: relative; border-left: 1px solid #ececec; background: #fafafa; overflow: hidden; }
  .pv-empty { position: absolute; inset: 0; display: grid; place-items: center; color: #9a9a9a; }
  .pv-md { position: absolute; inset: 0; padding: 20px 26px; background: #fff; opacity: 0; }
  .pv-md h1 { margin: 0 0 10px; font-size: 22px; padding-bottom: 8px; border-bottom: 1px solid #e5e7eb; }
  .pv-md h2 { margin: 16px 0 10px; font-size: 16px; }
  .pv-md blockquote { margin: 0; padding: 2px 12px; border-left: 3px solid #d1d5db; color: #6b7280; }
  .pv-md img { display: block; width: 46%; border: 1px solid #e5e7eb; border-radius: 4px; }
  .pv-md p { margin: 0 0 8px; font-size: 13.5px; line-height: 1.75; color: #374151; }
  .pv-md code { font-family: var(--mono); font-size: 12.5px; background: #f3f4f6; padding: 1px 5px; border-radius: 4px; }

  .vbody { flex: 1; min-height: 0; padding: 14px 44px; background: #161616; }
  .vimg { width: 100%; height: 100%; border-radius: 4px; background-size: 100% auto; background-repeat: no-repeat; background-position: center 0; }
  .vfoot { flex: none; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 12px; color: #9a9a9a; }

  /* ---- 框选 / 飞入 / 光标 ---- */
  #dim { position: absolute; inset: 0; pointer-events: none; }
  #sel { position: absolute; border: 2px solid var(--paper); box-shadow: 0 0 0 9999px rgba(11,18,32,.5); }
  #sel span { position: absolute; left: -2px; top: -30px; height: 24px; padding: 0 9px; background: var(--paper); color: var(--ink); font: 600 12.5px/24px var(--mono); white-space: nowrap; }
  #sel i { position: absolute; width: 10px; height: 10px; background: var(--paper); border: 2px solid var(--ink); }
  #flash { position: absolute; background: #fff; }
  #thumb { position: absolute; border: 3px solid var(--paper); box-shadow: 0 14px 34px rgba(0,0,0,.4); background-size: cover; background-position: left top; }
  #ghost { position: absolute; border: 2px dashed rgba(238,242,247,.6); display: grid; place-items: center; color: var(--paper); font: 900 40px var(--head);
    background: repeating-linear-gradient(135deg, rgba(238,242,247,.08) 0 2px, transparent 2px 16px); }
  .ripple { position: absolute; border-radius: 50%; border: 3px solid var(--hot2); pointer-events: none; }
  #cursor { position: absolute; width: 30px; height: 30px; margin: -3px 0 0 -5px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
  #cursor svg { width: 100%; height: 100%; transform-origin: 5px 3px; }

  /* ==================== 画面叠加 ==================== */
  .layer { position: absolute; inset: 0; pointer-events: none; }
  #vignette { display: none; }
  #dip { background: var(--ink); }

  /* 分屏对比的标注：不装进框里，直接写在纸上 */
  .lbl { position: absolute; display: flex; align-items: center; gap: 12px; font: 900 25px var(--head); color: var(--ink); white-space: nowrap; }
  .lbl i { width: 14px; height: 14px; background: var(--ink); }
  .lbl.red i { background: var(--hot); }

  /* 下三分之一：贴左缘的纸色实心块，大号编号 + 衬线标题 */
  #lower { position: absolute; left: 0; bottom: 72px; width: 780px; padding: 30px 48px 32px 56px; background: var(--paper); color: var(--ink);
    display: grid; grid-template-columns: auto 1fr; column-gap: 30px; align-items: start; }
  #lower.nonum { grid-template-columns: 1fr; }
  #lower.nonum .lt-num { display: none; }
  .lt-num { font: 700 96px/.86 var(--num); letter-spacing: -3px; color: var(--hot); font-variant-numeric: tabular-nums; }
  .lt-tag { font: 600 15px var(--mono); letter-spacing: 3px; color: var(--ink2); margin-bottom: 10px; }
  .lt-title { font: 900 38px/1.25 var(--head); }
  .lt-sub { font: 400 19px/1.7 var(--sans); color: var(--ink2); margin-top: 10px; text-wrap: pretty; }
  .lt-keys { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; margin-top: 20px; }
  .kg { display: flex; align-items: center; gap: 6px; font: 500 17px var(--sans); color: var(--ink); }
  .kg em { font-style: normal; margin-left: 6px; color: var(--ink2); }
  kbd { display: inline-grid; place-items: center; min-width: 36px; height: 32px; padding: 0 10px; border-radius: 2px;
    font: 600 15px var(--mono); color: var(--paper); background: var(--ink); }
  .kg.down kbd { transform: translateY(2px); background: var(--hot); color: #fff; }
  .plus { color: var(--ink2); font-size: 15px; }

  /* ---- 片头 / 片尾 ---- */
  .scene { display: grid; place-items: center; }
  #intro, #outro { background: var(--paper); color: var(--ink); }
  .gridbg { display: none; }
  .hero { position: relative; display: flex; flex-direction: column; align-items: center; }
  .brand { display: flex; align-items: center; }
  .logo { width: 196px; height: 196px; flex: none; }
  .word { font: 700 172px/1 var(--num); letter-spacing: -4px; color: var(--ink); overflow: hidden; white-space: nowrap; }
  .tagline { margin-top: 48px; font: 900 48px var(--head); letter-spacing: 6px; color: var(--ink); }
  .tagline b { color: var(--hot); font-weight: 900; margin: 0 16px; }
  .subline { margin-top: 22px; font: 500 22px var(--mono); letter-spacing: 3px; color: var(--ink2); }
  .ping { position: absolute; border-radius: 50%; border: 3px solid var(--hot); }

  .chips { display: flex; gap: 40px; margin-top: 46px; }
  .chip { display: flex; align-items: center; gap: 12px; font: 700 22px var(--sans); color: var(--ink); }
  .repo { margin-top: 44px; height: 66px; padding: 0 36px; display: flex; align-items: center; gap: 14px;
    font: 600 27px var(--mono); color: var(--paper); background: var(--ink); }
  .repo svg { width: 30px; height: 30px; }
  .credit { margin-top: 28px; font: 400 19px var(--sans); letter-spacing: 1px; color: var(--ink2); }

  /* ---- README 横幅（仅静帧导出时出现）：左纸右暗，硬切 ---- */
  #banner { background: linear-gradient(90deg, var(--paper) 0, var(--paper) 49.5%, transparent 49.5%); }
  .bn { position: absolute; left: 112px; top: 140px; width: 800px; height: 800px; display: flex; flex-direction: column; justify-content: center; color: var(--ink); }
  .bn .logo { width: 128px; height: 128px; }
  .bn .word { font-size: 122px; letter-spacing: -3px; }
  .bn-tag { margin-top: 40px; font: 900 46px/1.25 var(--head); letter-spacing: 2px; color: var(--ink); white-space: nowrap; }
  .bn.en .bn-tag { letter-spacing: 0; font-size: 54px; }
  .bn-tag b { color: var(--hot); font-weight: 900; margin: 0 8px; }
  .bn.en .bn-tag b { margin: 0; }
  .bn-sub { margin-top: 20px; font: 400 23px/1.7 var(--sans); color: var(--ink2); }
  .bn .chips { margin-top: 34px; gap: 14px 30px; flex-wrap: wrap; }
  .bn .chip { font-size: 21px; }
  .chip.sq::before { content: ""; width: 10px; height: 10px; background: var(--hot); }
  .bn-foot { margin-top: 40px; font: 500 16px var(--mono); letter-spacing: 1px; color: var(--ink2); }

  /* ---- 功能宫格：目录式，只有顶部一条粗线 ---- */
  #more { background: var(--paper); color: var(--ink); }
  .more-in { width: 1640px; }
  .more-h { font: 900 68px var(--head); color: var(--ink); letter-spacing: 2px; }
  .more-h span { color: var(--hot); }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 58px 48px; margin-top: 56px; }
  .card::before { content: ""; display: block; height: 3px; background: var(--ink); margin-bottom: 18px; transform: scaleX(var(--rule, 1)); transform-origin: 0 0; }
  .card .n { font: 700 17px var(--mono); letter-spacing: 2px; color: var(--hot); }
  .card h3 { margin: 12px 0 10px; font: 900 30px var(--head); color: var(--ink); display: flex; align-items: center; gap: 12px; }
  .card h3 kbd { height: 28px; min-width: 32px; font-size: 13px; }
  .card p { margin: 0; font: 400 18.5px/1.7 var(--sans); color: var(--ink2); text-wrap: pretty; }

  /* ---- 预览播放器 ---- */
  #player { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
    padding: 8px 16px; background: rgba(11,18,32,.92); color: #c5d0e0; font: 13px var(--mono); z-index: 10; }
  #player button { all: unset; cursor: pointer; padding: 4px 10px; background: #1b2536; }
  #player input { width: 520px; accent-color: #38bdf8; }
</style>
</head>
<body>
<div id="fit">
  <div id="stage">
    <div id="world">
      <div class="desk"></div>
      <div id="appwrap"><iframe id="app" title="Cue" scrolling="no" allowtransparency="true"></iframe></div>
      <div id="fdlg" class="oswin"></div>
      <div id="selpop"></div>
      <div id="explorer" class="oswin"></div>
      <div id="viewer" class="oswin"></div>
      <div id="dim"><div id="sel"><span></span><i style="left:-6px;top:-6px"></i><i style="right:-6px;top:-6px"></i><i style="left:-6px;bottom:-6px"></i><i style="right:-6px;bottom:-6px"></i></div></div>
      <div id="flash"></div>
      <div id="thumb"></div>
      <div id="ripples"></div>
      <div id="cursor"><svg viewBox="0 0 30 30"><path d="M5 3 L5 24 L10.6 18.8 L14.4 27 L18 25.4 L14.3 17.4 L22 17.2 Z" fill="#fff" stroke="#0b1220" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
    </div>
    <div id="share"><div class="desk"></div><div id="ghost">Cue 不在画面里</div></div>

    <div class="layer" id="vignette"></div>
    <div class="lbl" id="lbl-you"><i></i>你的屏幕</div>
    <div class="lbl red" id="lbl-share"><i></i>对方看到的共享画面</div>
    <div class="layer" id="dip"></div>

    <div class="layer scene" id="more"><div class="more-in"><div class="more-h">一个悬浮窗，<span>全都有</span></div><div class="cards"></div></div></div>
    <div id="lower"><div class="lt-num"></div><div class="lt-body"><div class="lt-tag"></div><div class="lt-title"></div><div class="lt-sub"></div></div><div class="lt-keys"></div></div>

    <div class="layer" id="banner" style="display:none"></div>
    <div class="layer scene" id="intro"></div>
    <div class="layer scene" id="outro"></div>
  </div>
</div>

<div id="player">
  <button id="pp">暂停</button>
  <input id="seek" type="range" min="0" max="1" step="0.001" value="0">
  <span id="clock">0.00</span>
</div>

<script src="stage.js"></script>
</body>
</html>
